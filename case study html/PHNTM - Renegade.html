document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er-spacing: -0.01em;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);\n}\nimg { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\n::selection { background: var(--ink); color: var(--paper); }\n\n/* ---- Type primitives ---- */\nh1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.025em; line-height: 1.04; text-wrap: balance; }\np { margin: 0; text-wrap: pretty; }\n\n.mono {\n  font-family: var(--font-mono);\n  font-size: var(--fs-label);\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 400;\n}\n.mono-wide { letter-spacing: 0.18em; }\n.gray { color: var(--gray); }\n.lede { font-size: var(--fs-lede); line-height: 1.45; font-weight: 500; letter-spacing: -0.012em; color: var(--ink-2); }\n\n/* ============================================================\n   LAYOUT\n   ============================================================ */\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }\n.section { padding-block: clamp(40px, 6vw, 88px); }\n.section--tight { padding-block: clamp(26px, 4vw, 56px); }\n\n/* full-bleed band that ignores the wrap padding */\n.band { width: 100%; }\n.band-dark {\n  background: var(--night); color: var(--night-ink);\n  --ink: var(--night-ink); --ink-2: var(--night-ink); --gray: var(--night-gray); --hair: var(--night-hair);\n}\n\n/* section label row — mono, hairline above */\n.seclabel {\n  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-4);\n  border-top: 1px solid var(--ink);\n  padding-top: 14px; margin-bottom: clamp(28px, 4vw, 52px);\n  font-family: var(--font-mono); font-size: var(--fs-label);\n  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2);\n}\n[data-theme=\"dark\"] .seclabel { color: var(--ink-2); }\n.seclabel .r { color: var(--gray); }\n\n/* eyebrow — mono with growing rule */\n.eye ay); }\n.role-row .go { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; }\n\n/* CTA band (pattern) */\n.cta-band { position: relative; overflow: hidden; padding: clamp(64px,10vw,128px) var(--gutter); text-align: center; }\n.cta-band .pat { position: absolute; inset: 0; background: url(\"8cd2f14c-de43-48a3-927c-27abdcefff1e\") center/112% auto no-repeat; opacity: 0.16; pointer-events: none; }\n.cta-band__in { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; }\n.cta-band h2 { font-size: var(--fs-display); font-weight: 700; letter-spacing: -0.035em; line-height: 1; }\n.cta-band .mail { display: inline-flex; align-items: center; gap: 10px; margin-top: clamp(24px,3vw,34px); font-size: clamp(18px,2vw,22px); font-weight: 600; letter-spacing: -0.01em; cursor: pointer; transition: opacity var(--dur-fast) var(--ease); }\n.cta-band .mail:hover { opacity: 0.6; }\n\n/* ============================================================\n   CONTACT  (dark · single viewport, no scroll)\n   ============================================================ */\n.contact-page { height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--night); }\n.contact-page .site-head { position: static; flex: none; }\n.contact { flex: 1 1 auto; display: flex; align-items: center; min-height: 0; padding-block: clamp(20px,3vw,40px); }\n.contact__in { width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }\n.contact .eyebrow { color: var(--night-gray); margin-bottom: clamp(26px,4vw,48px); }\n.contact .eyebrow .rule { background: var(--night-hair); }\n.contact__in { display: grid; grid-template-columns: 1fr auto; gap: clamp(40px,7vw,120px); align-items: center; width: 100%; max-width: var(--maxw); margin: 0 auto; padding-inline: var(--gutter); }\n.connect { display: flex; flex-direction: column; }\n.connect a {\n  display: block; white-space: nowrap;\n  font-size: clamp(28px, 4.8vw, 60px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.22;\n  color: var(--night-ink); transition: opacity var(--dur-fast) var(--ease); width: max-content; max-width: 100%;\n}\n.connect a:hover { opacity: 0.55; }\n\n/* brand icon set — introduced here, presented as a set (film-strip grid) */\n.contact-icons { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--night-hair); border-left: 1px solid var(--night-hair); width: clamp(190px, 22vw, 290px); }\n.contact-icons span { display: grid; place-items: center; aspect-ratio: 1 / 1; border-right: 1px solid var(--night-hair); border-bottom: 1px solid var(--night-hair); }\n.contact-icons img { width: clamp(34px, 3.8vw, 54px); height: auto; opacity: 0.92; }\n\n/* slim footer pinned to viewport bottom */\n.contact-foot-slim { flex: none; border-top: 1px solid var(--night-hair); padding: 16px var(--gutter); }\n.contact-foot-slim__in { max-width: var(--maxw); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 28px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--night-gray); }\n.contact-foot-slim__in a { color: var(--night-gray); transition: color var(--dur-fast) var(--ease); }\n.contact-foot-slim__in a:hover { color: var(--night-ink); }\n.contact-foot-slim__in .sep { flex: 1; }\n.contact-foot-slim__brand { display: inline-flex; align-items: center; }\n.contact-foot-slim__brand img { height: 15px; width: auto; display: block; }\n.contact-foot-slim .copyline { display: inline-flex; align-items: center; }\n.contact-foot-slim .cmark { display: inline-flex; align-items: center; justify-content: center; width: 1.18em; height: 1.18em; margin-right: 0.5em; border: 1px solid currentColor; border-radius: 50%; box-sizing: border-box; font-size: 0.82em; line-height: 1; }\n\n/* ============================================================\n   CASE STUDY  (bespoke project page — editorial + cinematic)\n   ============================================================ */\nbody { overflow-x: clip; }\n\n.cs-head { padding-top: clamp(8px,1.5vw,20px); }\n.cs-back { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray); margin-bottom: clamp(20px,2.5vw,30px); }\n.cs-back:hover { color: var(--ink); }\n.cs-head__eyebrow { margin-bottom: clamp(18px,2.2vw,26px); }\n.cs-title { font-size: var(--fs-display); font-weight: 700; letter-spacing: -0.038em; line-height: 0.95; max-width: 16ch; }\n.cs-lede { margin-top: clamp(20px,2.6vw,30px); max-width: 30ch; font-size: clamp(20px,2.4vw,30px); line-height: 1.28; font-weight: 500; letter-spacing: -0.018em; color: var(--ink-2); }\n[data-theme=\"dark\"] .cs-lede { color: var(--ink-2); }\n\n.cs-hero { margin-top: clamp(28px,3.5vw,48px); }\n.cs-hero .media { aspect-ratio: 16 / 9; }\n\n/* meta strip — clean columns, no vertical dividers */\n.cs-meta { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); margin-top: clamp(24px,3vw,36px); padding-top: 18px; }\n.cs-meta .m { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-right: 24px; }\n.cs-meta .m .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); }\n.cs-meta .m .v { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }\n\n/* prose block — mono label left, prose right */\n.cs-block { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: clamp(24px,5vw,80px); align-items: start; }\n.cs-block__lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); padding-top: 6px; }\n.cs-block__prose { max-width: 60ch; }\n.cs-block__prose p { font-size: clamp(17px,1.5vw,20px); line-height: 1.6; color: var(--ink-2); }\n[data-theme=\"dark\"] .cs-block__prose p { color: var(--ink-2); }\n.cs-block__prose p + p { margin-top: 1.1em; }\n.cs-block__prose p.big { font-size: clamp(22px,2.4vw,30px); line-height: 1.34; letter-spacing: -0.015em; font-weight: 500; color: var(--ink); }\n.cs-block__prose p .hl { color: var(--ink); font-weight: 600; }\n\n/* full-bleed media */\n.cs-bleed { position: relative; margin-inline: calc(50% - 50vw); width: 100vw; margin-block: clamp(40px,6vw,96px); }\n.cs-bleed img { width: 100%; height: clamp(380px, 78vh, 880px); object-fit: cover; display: block; }\n.cs-bleed--tall img { height: clamp(460px, 92vh, 1080px); }\n\n/* centered portrait plate */\n.cs-portrait { margin-block: clamp(40px,6vw,96px); display: flex; flex-direction: column; align-items: center; gap: 14px; }\n.cs-portrait .media { width: min(100%, 640px); aspect-ratio: 4 / 5; }\n.cs-portrait figcaption { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray); }\n.cs-portrait figcaption .ix { color: var(--ink-2); }\n\n/* feature row — tall portrait beside a filling landscape */\n.cs-feature { display: grid; grid-template-columns: 0.72fr 1fr; gap: clamp(16px,2vw,24px); align-items: stretch; }\n.cs-feature .tall { aspect-ratio: 4 / 5; }\n.cs-feature .fill { position: relative; overflow: hidden; border-radius: var(--r-md); }\n.cs-feature .fill img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }\n.cs-feature--flip .tall { order: 2; }\n.cs-cap { display: flex; gap: 16px; align-items: baseline; max-width: var(--maxw); margin: 14px auto 0; padding-inline: var(--gutter); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray); }\n.cs-cap .ix { color: var(--ink-2); }\n\n/* film */\n.cs-film { margin-top: clamp(10px,1.5vw,18px); }\n.cs-film .reel { aspect-ratio: 16 / 9; }\n\n/* vertical phone-format clip, integrated beside a still */\n.cs-vlabel { display: flex; align-items: center; gap: 14px; margin-bottom: clamp(18px,2.4vw,28px); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); }\n.cs-vlabel .rule { flex: 1; height: 1px; background: var(--hair); }\n.cs-vrow { display: grid; grid-template-columns: 360px minmax(0,1fr); gap: clamp(16px,2vw,24px); align-items: stretch; }\n.cs-vrow .reel { aspect-ratio: 9 / 16; width: 100%; }\n.cs-vrow .vphoto { position: relative; overflow: hidden; border-radius: var(--r-md); }\n.cs-vrow .vphoto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }\n\n/* next — full-width text CTA, no repeated image */\n.cs-next { display: flex; align-items: baseline; justify-content: space-between; gap: 16px 40px; flex-wrap: wrap; border-top: 1px solid var(--ink); padding-top: clamp(22px,3vw,36px); }\n.cs-next .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); }\n.cs-next .proj { font-size: clamp(30px,5vw,64px); font-weight: 700; letter-spacing: -0.03em; line-height: 0.98; }\n.cs-next .proj .arw { display: inline-block; transition: transform var(--dur) var(--ease); }\n.cs-next:hover .proj .arw { transform: translateX(10px); }\n\n/* split pair */\n.cs-split { display: grid; grid-template-columns: 0.78fr 1.22fr; gap: clamp(16px,2vw,24px); align-items: stretch; }\n.cs-split .media { width: 100%; height: 100%; }\n.cs-split .media.tall { aspect-ratio: 3 / 4; }\n.cs-split .media.wide { aspect-ratio: auto; }\n\n/* equal pair */\n.cs-duo { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px,2vw,24px); }\n.cs-duo .media.v { aspect-ratio: 4 / 5; }\n.cs-duo .media.h { aspect-ratio: 3 / 2; }\n.cs-duo .media.sq { aspect-ratio: 1 / 1; }\n/* staggered duo for editorial rhythm */\n.cs-duo--offset .media:nth-child(2) { margin-top: clamp(30px,6vw,88px); }\n.cs-duo--tilt .media:nth-child(1) { margin-top: clamp(30px,6vw,88px); }\n\n/* equal trio */\n.cs-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(16px,2vw,24px); }\n.cs-trio .media { aspect-ratio: 4 / 5; }\n\n/* stat pull */\n.cs-stat { border-top: 1px solid var(--ink); padding-top: clamp(20px,2.5vw,32px); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px 40px; align-items: end; }\n.cs-stat .num { font-size: clamp(72px,14vw,200px); font-weight: 700; letter-spacing: -0.05em; line-height: 0.84; }\n.cs-stat .num .u { color: var(--live); }\n.cs-stat .cap { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); max-width: 26ch; text-align: right; line-height: 1.8; }\n\n@media (max-width: 900px) {\n  .cs-block { grid-template-columns: 1fr; gap: 14px; }\n  .cs-block__lbl { padding-top: 0; }\n  .cs-split { grid-template-columns: 1fr; }\n  .cs-split .media.tall, .cs-split .media.wide { aspect-ratio: 4 / 3; }\n  .cs-duo { grid-template-columns: 1fr; }\n  .cs-duo--offset .media:nth-child(2), .cs-duo--tilt .media:nth-child(1) { margin-top: 0; }\n  .cs-feature { grid-template-columns: 1fr; }\n  .cs-feature .tall { aspect-ratio: 4 / 5; max-width: 460px; margin: 0 auto; width: 100%; }\n  .cs-feature .fill { aspect-ratio: 3 / 2; }\n  .cs-feature--flip .tall { order: 0; }\n  .cs-vrow { grid-template-columns: 1fr; }\n  .cs-vrow .reel { width: min(100%, 360px); margin: 0 auto; }\n  .cs-duo .media.v { aspect-ratio: 4 / 5; max-width: 460px; margin: 0 auto; width: 100%; }\n  .cs-trio { grid-template-columns: 1fr; }\n  .cs-trio .media { max-width: 460px; margin: 0 auto; width: 100%; }\n  .cs-meta { grid-template-columns: repeat(2, 1fr); gap: 20px 0; }\n  .cs-stat { grid-template-columns: 1fr; }\n  .cs-stat .cap { text-align: left; }\n}\n\n/* ============================================================\n   PLATFORM PAGE (MODE) — explain + drive to tickets\n   ============================================================ */\n.plat-cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: clamp(22px,3vw,32px); align-items: center; }\n.plat-when { display: flex; flex-wrap: wrap; gap: 8px 30px; margin-top: clamp(20px,2.6vw,30px); font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }\n.plat-when .g { color: var(--gray); }\n\n.plat-passes { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(16px,2vw,24px); }\n.pass { border: 1px solid var(--hair); border-radius: var(--r-lg); padding: clamp(22px,2.4vw,32px); display: flex; flex-direction: column; gap: 16px; }\n.pass--feature { border-color: var(--ink); }\n.pass__name { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); }\n.pass__price { font-size: clamp(36px,4.2vw,56px); font-weight: 700; letter-spacing: -0.03em; line-height: 0.9; }\n.pass__price .d { color: var(--gray); font-weight: 500; }\n.pass__list { display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.4; color: var(--ink-2); flex: 1; margin: 4px 0 4px; }\n.pass__list .it { position: relative; padding-left: 18px; }\n.pass__list .it::before { content: \"■\"; position: absolute; left: 0; top: 0.05em; color: var(--gray); font-size: 7px; }\n.pass .btn { margin-top: auto; justify-content: center; }\n\n.plat-line { border-top: 1px solid var(--ink); }\n.plat-line .r { display: grid; grid-template-columns: 1fr auto; gap: 16px 24px; align-items: baseline; padding: clamp(15px,1.8vw,22px) 0; border-bottom: 1px solid var(--hair); }\n.plat-line .nm { font-size: clamp(22px,2.6vw,34px); font-weight: 600; letter-spacing: -0.025em; }\n.plat-line .role { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray); white-space: nowrap; }\n\n.plat-band { position: relative; overflow: hidden; padding: clamp(56px,9vw,120px) var(--gutter); text-align: center; }\n.plat-band .pat { position: absolute; inset: 0; background: url(\"8cd2f14c-de43-48a3-927c-27abdcefff1e\") center/130% no-repeat; opacity: 0.14; pointer-events: none; }\n.plat-band__in { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; }\n.plat-band h2 { font-size: var(--fs-display); font-weight: 700; letter-spacing: -0.035em; line-height: 1; max-width: 18ch; margin: 0 auto; }\n.plat-band__sub { margin: clamp(16px,2vw,22px) auto 0; max-width: 44ch; font-size: var(--fs-lede); line-height: 1.4; color: var(--night-gray); }\n\n/* lineup poster */\n.plat-poster { display: flex; justify-content: center; }\n.plat-poster img { width: 100%; max-width: 760px; height: auto; border-radius: var(--r-md); border: 1px solid var(--hair); }\n\n/* full media — no crop, natural aspect */\n.cs-hero .media--full { aspect-ratio: auto; }\n.cs-hero .media--full > img { position: static; width: 100%; height: auto; object-fit: contain; }\n\n@media (max-width: 900px) {\n  .plat-passes { grid-template-columns: 1fr; }\n  .plat-line .r { grid-template-columns: 1fr; gap: 4px; }\n  .plat-line .role { text-align: left; }\n}\n\n/* ============================================================\n   RESPONSIVE\n   ============================================================ */\n@media (max-width: 1040px) {\n  .contact-page { height: auto; min-height: 100vh; overflow: visible; }\n  .contact { padding-block: clamp(32px,9vw,56px); }\n  .contact__in { grid-template-columns: 1fr; gap: clamp(36px,8vw,56px); }\n  .connect a { font-size: clamp(44px,12vw,72px); line-height: 1.16; }\n  .contact-icons { display: none; }\n  .contact-routes { grid-template-columns: 1fr; }\n  .route { border-right: none; padding-right: 0; }\n  .index-grid { grid-template-columns: repeat(2, 1fr); }\n  .scalerow { grid-template-columns: 44px 1fr 1.3fr; }\n  .scalerow .ex { display: none; }\n  .caprow { grid-template-columns: 44px 1fr 1.1fr; }\n  .caprow .ds { display: none; }\n  .wd-did { grid-template-column
